# Builds the desktop installers and attaches them to the GitHub Release that the "Release" workflow
# (cargo-dist, CLI) created for the same tag. Can also be run by hand for an existing tag.
name: Desktop release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Desktop (${{ matrix.name }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Install the desktop app's npm dependencies
        working-directory: apps/desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.TAG }}
          # MSI only accepts numeric versions: pre-releases (v0.1.0-beta.1) ship the NSIS .exe only
          args: ${{ matrix.args }} ${{ runner.os == 'Windows' && contains(env.TAG, '-') && '--bundles nsis' || '' }}
      - name: Package the Windows Store MSIX
        if: runner.os == 'Windows' && !contains(env.TAG, '-') && vars.MSIX_PACKAGE_NAME != ''
        shell: pwsh
        env:
          MSIX_PACKAGE_NAME: ${{ vars.MSIX_PACKAGE_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          ./apps/desktop/scripts/package-msix.ps1 `
            -PackageName $env:MSIX_PACKAGE_NAME `
            -Publisher $env:MSIX_PUBLISHER `
            -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME
      - name: Upload the Windows Store submission package
        if: runner.os == 'Windows' && !contains(env.TAG, '-') && vars.MSIX_PACKAGE_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: resume-ai-windows-store
          path: target/release/bundle/msix/*.msix
          if-no-files-found: error
