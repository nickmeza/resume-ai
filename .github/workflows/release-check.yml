# Temporary diagnostic: which kind of release can GITHUB_TOKEN create in this repository?
name: Check release permission

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - run: echo test > note.txt
      - name: A) draft
        run: gh release create check-a --repo "$REPO" --draft --title a --notes-file note.txt --target "$GITHUB_SHA" && echo "A OK" || echo "A FAILED"
      - name: B) published prerelease, new tag
        run: gh release create check-b --repo "$REPO" --prerelease --title b --notes-file note.txt --target "$GITHUB_SHA" && echo "B OK" || echo "B FAILED"
      - name: C) published prerelease with an asset (like cargo-dist)
        run: gh release create check-c --repo "$REPO" --prerelease --title c --notes-file note.txt --target "$GITHUB_SHA" note.txt && echo "C OK" || echo "C FAILED"
      - name: D) release for the existing tag v0.1.0-beta.1, draft
        run: gh release create v0.1.0-beta.1 --repo "$REPO" --draft --title d --notes-file note.txt && echo "D OK" || echo "D FAILED"
      - name: Clean up
        if: always()
        run: |
          for t in check-a check-b check-c; do gh release delete "$t" --repo "$REPO" --yes --cleanup-tag || true; done
          gh release delete v0.1.0-beta.1 --repo "$REPO" --yes || true
