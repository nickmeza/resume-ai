[package]
name = "resume-ai"
description = "List and resume your AI coding-agent sessions from the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["claude", "ai", "agents", "sessions", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

# npm: `npm i -g resume-ai-cli` installs the `resume-ai` command (the name resume-ai is taken on npm)
[package.metadata.dist]
npm-package = "resume-ai-cli"

[[bin]]
name = "resume-ai"
path = "src/main.rs"

[dependencies]
resume-ai-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
portable-pty.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
vt100.workspace = true
