[workspace]
resolver = "3"
members = ["crates/resume-ai-core", "crates/resume-ai", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/nickmeza/resume-ai"
authors = ["Nick Meza"]

[workspace.dependencies]
resume-ai-core = { path = "crates/resume-ai-core" }
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
portable-pty = "0.8"
ratatui = "0.29"
unicode-width = "0.2"
vt100 = "0.15"
dirs = "6"
md-5 = "0.10"
rayon = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sys-locale = "0.3"
toml = "0.8"
trash = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
